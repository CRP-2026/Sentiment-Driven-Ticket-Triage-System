services:
  backend:
    command: ["uvicorn", "ticket_triage.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./ticket-triage-be/models:/app/models:ro
      - ./contracts:/contracts
      - db_data:/data
  frontend:
    build:
      context: ./ticket-triage-fe
      target: demo
    environment: {}
    volumes: []
    ports: ["8080:80"]