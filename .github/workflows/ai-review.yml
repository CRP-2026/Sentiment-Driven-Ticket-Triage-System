name: AI Code Review

on:
  # 1. Chạy theo yêu cầu khi bạn comment /review hoặc /ai-review vào PR
  issue_comment:
    types: [created]

  # 2. Chạy theo yêu cầu khi bạn gán label 'ai-review' cho PR
  pull_request:
    types: [labeled]

  # 3. Chạy thủ công từ tab Actions trên GitHub (bấm Run workflow)
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Số Pull Request cần review (ví dụ: 1)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: AI Review PR
    runs-on: ubuntu-latest
    # Chỉ chạy khi:
    # - Bấm nút thủ công (workflow_dispatch)
    # - Hoặc gán label 'ai-review'
    # - Hoặc comment có chứa '/review' hoặc '/ai-review' trên một Pull Request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'ai-review') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '/ai-review')))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract PR Information
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ github.event.inputs.pr_number }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
          else
            PR_NUM="${{ github.event.issue.number }}"
          fi

          echo "PR_NUMBER=$PR_NUM" >> $GITHUB_ENV

          # Lấy thông tin PR bằng GitHub CLI
          PR_JSON=$(gh pr view "$PR_NUM" --json title,body,baseRefName,headRefName)
          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          BODY=$(echo "$PR_JSON" | jq -r '.body // ""')
          BASE=$(echo "$PR_JSON" | jq -r '.baseRefName')
          HEAD=$(echo "$PR_JSON" | jq -r '.headRefName')

          echo "PR_TITLE=$TITLE" >> $GITHUB_ENV
          echo "PR_BODY=$BODY" >> $GITHUB_ENV
          echo "BASE_REF=$BASE" >> $GITHUB_ENV
          echo "HEAD_REF=$HEAD" >> $GITHUB_ENV

          # Checkout nhánh của PR
          git checkout "origin/$HEAD" || git checkout "$HEAD" || true

      - name: Run AI Reviewer with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GUIDELINES_FILE: .github/review_guidelines.md
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Thiếu secret GEMINI_API_KEY. Vui lòng thêm vào Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python .github/scripts/ai_reviewer.py
