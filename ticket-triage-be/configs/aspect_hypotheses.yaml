overall_sentiment_template: "The sentiment of this customer review is {}."
aspect_detection_template: "This customer feedback is related to {aspect}."
aspect_sentiment_template: "The customer expresses a {sentiment} feeling towards {aspect}."

aspect_names:
  customer_service: "customer support and agent responsiveness"
  refund_payment: "refunds, charges, billing or payment dispute"
  product_quality: "product quality, material, durability or defect"
  shipping: "delivery time, shipping status or package condition"
  general: "general questions or account inquiries"

sentiments:
  positive: "positive and satisfied"
  neutral: "neutral or informational"
  negative: "negative, frustrated or dissatisfied"

urgency_hypothesis_template: "This customer ticket represents {}."
urgency_levels:
  critical: "an urgent crisis, severe financial loss, multiple billing error, or complete service failure requiring immediate escalation"
  high: "a serious complaint, long delivery delay, rude staff incident, or unresolved problem needing priority attention"
  normal: "a routine inquiry, minor inconvenience, or standard feedback"
